<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Guestbook</h1>
    <p class="sub">Two-tier demo &mdash; frontend &rarr; nginx &rarr; backend-api &rarr; sql-db</p>

    <form id="form" class="card">
      <label>Name <input id="name" name="name" maxlength="80" required /></label>
      <label>Message <textarea id="body" name="body" rows="3" maxlength="2000" required></textarea></label>
      <button type="submit">Sign</button>
    </form>

    <p id="err" class="err" hidden></p>

    <section id="list" class="list" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
